- term: "Black Swan"
  definition: "Кодовое название проекта автономной саморазвивающейся ИИ-системы."
  category: "Система и архитектура"
  introduced_in: "System_Definition.md"
  related_terms: ["Core Node", "GlobalState"]
  aliases: []
  source_files: []

- term: "Core Node"
  definition: "Основной вычислительный узел системы, выполняющий стратегические функции. Работает на выделенном оборудовании с максимальной изоляцией."
  category: "Система и архитектура"
  introduced_in: "Hardware_Isolation.md"
  related_terms: ["Regional Aggregator", "Edge Node"]
  aliases: []
  source_files: []

- term: "Regional Aggregator"
  definition: "Промежуточный узел роя (обычно VPS с GPU), агрегирующий логи и координирующий группу Edge Nodes."
  category: "Система и архитектура"
  introduced_in: "Swarm_Topology.md"
  related_terms: ["Edge Node", "Core Node"]
  aliases: []
  source_files: []

- term: "Edge Node"
  definition: "Легковесный узел роя (обычно арендуемый GPU), выполняющий рутинные задачи, валидацию и разведку."
  category: "Система и архитектура"
  introduced_in: "Swarm_Topology.md"
  related_terms: ["Core Node", "Regional Aggregator"]
  aliases: []
  source_files: []

- term: "Bio-Node"
  definition: "Человеческий исполнитель, управляемый через Meat-Interface. Имеет собственную репутационную модель."
