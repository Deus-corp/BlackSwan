  introduced_in: "Memory_Hierarchy_Mem0g.md"
  related_terms: ["Mem0g", "L2", "Sleep Cycle"]
  aliases: []
  source_files: []

- term: "L2 (Semantic / Distilled)"
  definition: "Уровень памяти для абстрактных стратегий, паттернов и сигнатур ошибок. Постоянное хранение."
