  introduced_in: "Global_State_and_Decision_Pipeline.md"
  related_terms: ["Decision Pipeline", "EventBus"]
  aliases: []
  source_files: []

- term: "Decision Pipeline"
  definition: "Унифицированный конвейер принятия решений (Proposal → Evaluation → Governance → Execution → Feedback)."
