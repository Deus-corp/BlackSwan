  introduced_in: "Memory_Hierarchy_Mem0g.md"
  related_terms: ["Mem0g", "DistilledWisdom", "ErrorSignature"]
  aliases: []
  source_files: []

- term: "L3 (Procedural / Core)"
  definition: "Уровень памяти для критических инвариантов, Core DNA и терминальных целей. Только через multi-model консенсус."
