  introduced_in: "Memory_Hierarchy_Mem0g.md"
  related_terms: ["Mem0g", "L3.0", "L3.1"]
  aliases: []
  source_files: []

- term: "L0 (Meta-Mem0g)"
  definition: "Мета-уровень памяти для оптимизации архитектуры самой Mem0g. Хранит записи о конфигурациях и их влиянии на метрики."
