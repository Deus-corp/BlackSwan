services:
  node:
    build:
      context: ../..
    image: blackswan-node:latest
    entrypoint: ["/app/mvp/lab_swarm_demo/node_entrypoint_async.sh"]
    environment:
      - BURN_RATE=0.2
      - FAILURE_PROB=0.0
      - GOSSIP_PORT=9777
      - TOTAL_NODES=4
      - PYTHONUNBUFFERED=1
      - LLM_MODEL=smollm17
      - GOSSIP_SIGNING_ENABLED=false
      - MEMORY_API_ENABLED=true
      - MARKET_MODE=sim
      - PRICE_SCALE=10000   # можно добавить, если хочешь менять
      - TRADING_SYMBOLS=BTC/USDT,ETH/USDT,SOL/USDT
      - BINANCE_TESTNET_API_KEY=${BINANCE_TESTNET_API_KEY}
      - BINANCE_TESTNET_API_SECRET=${BINANCE_TESTNET_API_SECRET}
      - LOG_LEVEL=INFO   # или DEBUG для детальных трейдов
      - INTERNET_RESEARCHER_ENABLED=true
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
    ports:
      - "9777"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0   # 0 = unlimited
      resources:
        limits:
          cpus: '0.8'
          memory: 2G
        reservations:
          cpus: '0.3'
          memory: 1G
    volumes:
      - ../../llama_cpp:/app/llama_cpp:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro