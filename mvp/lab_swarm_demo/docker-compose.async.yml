services:
  node:
    build:
      context: ../..
    image: blackswan-node:latest
    entrypoint: ["/app/mvp/lab_swarm_demo/node_entrypoint_async.sh"]
    environment:
      - BURN_RATE=0
      - FAILURE_PROB=0.0
      - GOSSIP_PORT=9777
      - TOTAL_NODES=4
      - PYTHONUNBUFFERED=1
      - LLM_MODEL=deepseek
      - GOSSIP_SIGNING_ENABLED=false
      - MEMORY_API_ENABLED=true
      - MARKET_MODE=web3
      - TEST_WEB3_SWAP_AMOUNT=0.001
      - TEST_WEB3_SWAP_SIDE=sell
      - WEB3_POOL_FEE=3000
      - PRICE_SCALE=10000
      - MIN_WETH_BALANCE=0.001
      - MIN_ETH_BALANCE=0.002
      - MAX_USDC_BALANCE=1000.0
      - TRADING_SYMBOLS=WETH/USDC
      - LOG_LEVEL=INFO
      - INTERNET_RESEARCHER_ENABLED=true
      - TRADINGVIEW_WEBHOOK_ENABLED=true
      - TRADINGVIEW_WEBHOOK_PORT=8888
      - ORDERBOOK_ANALYSIS_ENABLED=false
      - HEDGE_ENABLED=true
      - HEDGE_RATIO=0.5
      - CAPITAL_ALERT_THRESHOLD=100.0
      # Секреты
      - WEB3_PRIVATE_KEY=${WEB3_PRIVATE_KEY}
      - BINANCE_TESTNET_API_KEY=${BINANCE_TESTNET_API_KEY}
      - BINANCE_TESTNET_API_SECRET=${BINANCE_TESTNET_API_SECRET}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    ports:
      - "9777"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: '0.8'
          memory: 2G
        reservations:
          cpus: '0.3'
          memory: 1G
    volumes:
      - ../../llama_cpp:/app/llama_cpp:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - node_nonce_data:/app/nonce_data

volumes:
  node_nonce_data: