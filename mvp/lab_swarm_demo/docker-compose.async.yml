services:
  node:
    build:
      context: ../..
    image: blackswan-node:latest
    entrypoint: ["/app/mvp/lab_swarm_demo/node_entrypoint_async.sh"]
    environment:
      - BURN_RATE=0
      - FAILURE_PROB=0.0
      - GOSSIP_PORT=9777
      - TOTAL_NODES=4
      - PYTHONUNBUFFERED=1
      - LLM_MODEL=DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M
      - GOSSIP_SIGNING_ENABLED=true
      - MEMORY_API_ENABLED=true
      - MARKET_MODE=web3
      - TEST_WEB3_SWAP_AMOUNT=0.001
      - TEST_WEB3_SWAP_SIDE=sell
      - WEB3_POOL_FEE=3000
      - PRICE_SCALE=10000
      - MIN_WETH_BALANCE=0.001
      - MIN_ETH_BALANCE=0.002
      - MAX_USDC_BALANCE=100
      - TRADING_SYMBOLS=WETH/USDC
      - LOG_LEVEL=INFO
      - INTERNET_RESEARCHER_ENABLED=false
      - TRADINGVIEW_WEBHOOK_ENABLED=true
      - TRADINGVIEW_WEBHOOK_PORT=8888
      - ORDERBOOK_ANALYSIS_ENABLED=false
      - HEDGE_ENABLED=true
      - HEDGE_RATIO=0.5
      - CAPITAL_ALERT_THRESHOLD=100.0
      - WEB3_RPC_URL=${WEB3_RPC_URL}
      # Секреты
      - WEB3_PRIVATE_KEY=${WEB3_PRIVATE_KEY}
      - BINANCE_TESTNET_API_KEY=${BINANCE_TESTNET_API_KEY}
      - BINANCE_TESTNET_API_SECRET=${BINANCE_TESTNET_API_SECRET}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NODE_INDEX=${NODE_INDEX:-0}
    ports:
      - "9777"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: '0.8'
          memory: 2G
        reservations:
          cpus: '0.3'
          memory: 1G
    volumes:
      - ../../llama_cpp:/app/llama_cpp:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../data/nonce:/app/nonce_data

  meta-agent:
    build:
      context: ../..
    image: blackswan-node:latest
    entrypoint: ["python", "/app/mvp/lab_swarm_demo/meta_agent_node.py"]
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app              # ← ключевая строка
      - LLM_MODEL=DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M
      - GOSSIP_PORT=9777
      - TOTAL_NODES=4
      - GOSSIP_SIGNING_ENABLED=true
      - EVENT_LEDGER_PATH=/app/data/ledgers/meta_events.jsonl
      - EVENT_SQLITE_PATH=/app/data/ledgers/meta_events.db
      - EVENT_LEDGER_PATH=/app/data/ledgers/events.jsonl
      - EVENT_SQLITE_PATH=/app/data/ledgers/events.db
    ports:
      - "9778"
    networks:
      - default
    restart: unless-stopped
    volumes:
      - ../../llama_cpp:/app/llama_cpp:ro
      - ../../data/ledgers:/app/data/ledgers

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../../prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_CONTENT_SECURITY_POLICY=frame-ancestors 'self' http://localhost:8080
      - GF_SERVER_ROOT_URL=http://localhost:3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  node_nonce_data:
  prometheus_data:
  grafana_data: