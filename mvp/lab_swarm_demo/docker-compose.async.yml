services:
  node:
    build:
      context: ../..
    image: blackswan-node:latest
    entrypoint: ["/app/mvp/lab_swarm_demo/node_entrypoint_async.sh"]
    environment:
      - BURN_RATE=0.1
      - FAILURE_PROB=0.0
      - GOSSIP_PORT=9777
      - TOTAL_NODES=4
      - PYTHONUNBUFFERED=1
      - LLM_MODEL=qwen   # или deepseek
    ports:
      - "9777"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    volumes:
      - ../../llama_cpp:/app/llama_cpp:ro