services:
  node:
    build:
      context: ../..
    image: blackswan-node:latest
    entrypoint: ["/app/mvp/lab_swarm_demo/node_entrypoint_async.sh"]
    environment:
      - BURN_RATE=0.1
      - FAILURE_PROB=0.02
      - GOSSIP_PORT=9777
      - TOTAL_NODES=4
      - PYTHONUNBUFFERED=1
      - LLM_MODEL=smollm17
      - GOSSIP_SIGNING_ENABLED=false
    ports:
      - "9777"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0   # 0 = unlimited
      resources:
        limits:
          cpus: '0.8'
          memory: 2G
        reservations:
          cpus: '0.3'
          memory: 1G
    volumes:
      - ../../llama_cpp:/app/llama_cpp:ro 