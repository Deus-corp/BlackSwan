name: Python Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: .

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest -q tests/unit/core tests/unit --maxfail=1

      - name: Run swarm runtime smoke if improver is available
        run: |
          if [ -d "src/swarms/improver" ]; then
            python -m src.testing.swarm_runtime_smoke
          else
            echo "Skipping swarm runtime smoke: src/swarms/improver is not present in this checkout."
          fi

  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile core packages
        run: |
          python -m compileall -q src sim tests

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t blackswan-node:latest .
