name: Nightly Simulation and Formal Verification

on:
  schedule:
    - cron: '0 3 * * *'   # каждый день в 03:00 UTC
  workflow_dispatch:       # ручной запуск из Actions UI

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install numpy  # если нет в requirements.txt
      - name: Run Kelly evolution
        run: |
          mkdir -p results
          python sim/evolve_kelly.py > results/evolve_kelly.log 2>&1
      - name: Run Genetic Engine
        run: python sim/genetic_engine.py > results/genetic_engine.log 2>&1
      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs
          path: results/

  formal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spec:
          - NodeLifecycle
          - D2BFT
          - GlobalState
          - SporeProtocol
          - Ouroboros
          - CuriosityEngine
          - SurvivalObjective
          - GeneticEngine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Download TLA2Tools
        run: |
          curl -L -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Run TLC
        run: |
          java -cp tla2tools.jar tlc2.TLC formal/tla/${{ matrix.spec }}.tla -config formal/tla/${{ matrix.spec }}.cfg