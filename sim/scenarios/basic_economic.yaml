# Базовый сценарий: два агента на рынке с умеренной волатильностью
simulation:
  steps: 200          # количество шагов симуляции
  capital: 10000      # начальный капитал каждого агента
  agents:
    - type: KellyAgent
      capital: 10000
      max_risk: 0.02  # доля капитала на сделку
      phi: 0.25        # коэффициент осторожности Келли
    - type: RandomAgent
      capital: 10000
      max_risk: 0.02
market:
  volatility: 0.02    # волатильность доходностей за шаг
  drift: 0.0005        # долгосрочный дрейф цены